{{- if .Params.math -}}
<script>
  window.MathJax = {
    tex: {
      // Dollar delimiters are convenient in Markdown. Escaped delimiters
      // remain available when their backslashes survive Markdown parsing.
      inlineMath: [["$", "$"], ["\\(", "\\)"]],
      displayMath: [["$$", "$$"], ["\\[", "\\]"]],
      processEscapes: true,
      tags: "ams"
    },
    svg: { fontCache: "global" }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
{{- end -}}
