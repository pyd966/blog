baseURL = 'https://blog.example.com/'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
title = 'Your Name · Notes'
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true

[pagination]
  pagerSize = 8

[taxonomies]
  tag = 'tags'
  category = 'categories'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[params]
  env = 'production'
  author = 'Your Name'
  description = 'Notes on computer science, research, and building small useful things.'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowToc = true
  TocOpen = false
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true
  UseHugoToc = true
  hideFooter = false

  [params.label]
    text = 'Your Name'

  [params.homeInfoParams]
    Title = 'Notes from the work.'
    Content = 'A separate notebook for research notes, course ideas, and small things I learn while building.'

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    limit = 10
    keys = ['title', 'permalink', 'summary', 'content']

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/yourname'

  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:you@example.com'

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    url = '/'
    weight = 10

  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 20

  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    url = '/tags/'
    weight = 30

  [[menu.main]]
    identifier = 'archive'
    name = 'Archive'
    url = '/archives/'
    weight = 40

  [[menu.main]]
    identifier = 'homepage'
    name = 'Homepage ↗'
    url = 'https://yourname.github.io/'
    weight = 50
